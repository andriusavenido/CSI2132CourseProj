<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Building body -->
  <rect x="120" y="180" width="220" height="240" rx="4" fill="#3d8c72"/>
  <!-- Building roof / top bar -->
  <rect x="100" y="155" width="260" height="30" rx="4" fill="#52b896"/>
  <!-- Building door -->
  <rect x="195" y="330" width="70" height="90" rx="3" fill="#0f3330"/>
  <!-- Windows row 1 -->
  <rect x="140" y="210" width="45" height="40" rx="3" fill="#b8d0c8"/>
  <rect x="215" y="210" width="45" height="40" rx="3" fill="#b8d0c8"/>
  <rect x="290" y="210" width="45" height="40" rx="3" fill="#b8d0c8"/>
  <!-- Windows row 2 -->
  <rect x="140" y="275" width="45" height="40" rx="3" fill="#b8d0c8"/>
  <rect x="290" y="275" width="45" height="40" rx="3" fill="#b8d0c8"/>

  <!-- Magnifying glass circle -->
  <circle cx="340" cy="270" r="95" fill="none" stroke="#e0f0ec" stroke-width="22"/>
  <!-- Magnifying glass inner tint -->
  <circle cx="340" cy="270" r="84" fill="rgba(61,140,114,0.25)"/>
  <!-- Magnifying glass handle -->
  <line x1="412" y1="342" x2="470" y2="400" stroke="#e0f0ec" stroke-width="28" stroke-linecap="round"/>
</svg>
